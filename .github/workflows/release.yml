# Builds the Windows installer from this repository and publishes it as a GitHub
# Release. Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The Rust crate embeds the built frontend, so it has to exist before the tests compile.
      - run: npm run build

      - run: cargo test
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Claude Pet v__VERSION__
          releaseBody: |
            Windows installer. You also need [Claude Code](https://claude.com/claude-code) installed and logged in.
            The installer isn't code-signed yet, so SmartScreen may warn: *More info → Run anyway*.

            **Code signing policy:** free code signing provided by SignPath.io, certificate by SignPath Foundation (applied for; this release is unsigned). See the [code signing policy](https://github.com/Ledsav/claude-pet#code-signing-policy) and [privacy policy](https://github.com/Ledsav/claude-pet/blob/main/PRIVACY.md).
          releaseDraft: false
          prerelease: false

      # Kept as a build artifact too, so a signing service can pick up exactly what CI built.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
